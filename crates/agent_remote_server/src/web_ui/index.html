<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Zed Agent Chat</title>
        <!-- Marked.js for markdown rendering -->
        <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: #1e1e1e;
                color: #e0e0e0;
                height: 100vh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }

            #app {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100%;
            }

            /* Header */
            .header {
                background: #2d2d2d;
                padding: 12px 16px;
                border-bottom: 1px solid #3d3d3d;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-shrink: 0;
                gap: 16px;
            }

            .header-left {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .header h1 {
                font-size: 18px;
                font-weight: 600;
                color: #fff;
            }

            .header-right {
                display: flex;
                align-items: center;
                gap: 16px;
            }

            .model-info {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 2px;
            }

            .model-name {
                font-size: 12px;
                color: #e0e0e0;
                font-weight: 500;
            }

            .token-usage {
                font-size: 11px;
                color: #888;
                font-family: "SF Mono", Monaco, "Courier New", monospace;
            }

            .token-usage.warning {
                color: #ffc107;
            }

            .token-usage.exceeded {
                color: #f44336;
            }

            .status {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                color: #888;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #666;
            }

            .status-dot.connected {
                background: #4caf50;
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }

            .status-dot.connecting {
                background: #ffc107;
            }

            .status-dot.error {
                background: #f44336;
            }

            /* Messages container */
            .messages-container {
                flex: 1;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                -webkit-overflow-scrolling: touch;
            }

            .messages-container::-webkit-scrollbar {
                width: 6px;
            }

            .messages-container::-webkit-scrollbar-thumb {
                background: #444;
                border-radius: 3px;
            }

            /* Message bubbles */
            .message {
                display: flex;
                flex-direction: column;
                max-width: 85%;
                animation: slideIn 0.2s ease-out;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .message.user {
                align-self: flex-end;
                align-items: flex-end;
            }

            .message.assistant {
                align-self: flex-start;
                align-items: flex-start;
            }

            .message-content {
                padding: 10px 14px;
                border-radius: 16px;
                word-wrap: break-word;
                overflow-wrap: break-word;
                line-height: 1.4;
            }

            .message.user .message-content {
                background: #0084ff;
                color: #fff;
                border-bottom-right-radius: 4px;
            }

            .message.assistant .message-content {
                background: #2d2d2d;
                color: #e0e0e0;
                border-bottom-left-radius: 4px;
            }

            .message-content pre {
                background: rgba(0, 0, 0, 0.5);
                padding: 12px;
                border-radius: 6px;
                overflow-x: auto;
                margin: 10px 0;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .message-content pre code {
                font-family: "SF Mono", Monaco, "Courier New", monospace;
                font-size: 13px;
                background: none;
                padding: 0;
                display: block;
                color: #e0e0e0;
                line-height: 1.5;
            }

            .message-content code {
                font-family: "SF Mono", Monaco, "Courier New", monospace;
                font-size: 13px;
                background: rgba(0, 0, 0, 0.4);
                padding: 2px 6px;
                border-radius: 3px;
                color: #88c0d0;
            }

            .message-content p {
                margin: 4px 0;
            }

            .message-content h1,
            .message-content h2,
            .message-content h3,
            .message-content h4,
            .message-content h5,
            .message-content h6 {
                margin: 16px 0 8px 0;
                color: #fff;
                font-weight: 600;
            }

            .message-content h1 {
                font-size: 1.5em;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding-bottom: 4px;
            }

            .message-content h2 {
                font-size: 1.3em;
            }

            .message-content h3 {
                font-size: 1.1em;
            }

            .message-content ul,
            .message-content ol {
                margin: 8px 0;
                padding-left: 28px;
            }

            .message-content li {
                margin: 4px 0;
                line-height: 1.6;
            }

            .message-content li > p {
                margin: 2px 0;
            }

            .message-content blockquote {
                border-left: 3px solid #5e81ac;
                padding-left: 16px;
                margin: 12px 0;
                color: #aaa;
                font-style: italic;
            }

            .message-content a {
                color: #5e81ac;
                text-decoration: none;
                border-bottom: 1px solid rgba(94, 129, 172, 0.3);
                transition: border-color 0.2s;
            }

            .message-content a:hover {
                border-bottom-color: #5e81ac;
            }

            .message-content table {
                border-collapse: collapse;
                margin: 12px 0;
                width: 100%;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .message-content th,
            .message-content td {
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding: 8px 12px;
                text-align: left;
            }

            .message-content th {
                background: rgba(0, 0, 0, 0.4);
                font-weight: 600;
                color: #fff;
            }

            .message-content tr:hover {
                background: rgba(255, 255, 255, 0.02);
            }

            .message-content strong {
                color: #fff;
                font-weight: 600;
            }

            .message-content em {
                font-style: italic;
                color: #d8dee9;
            }

            .message-content hr {
                border: none;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                margin: 16px 0;
            }

            /* Tool calls */
            .tool-calls {
                margin: 12px 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .tool-call {
                background: rgba(0, 0, 0, 0.2);
                border-radius: 8px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .tool-header {
                padding: 8px 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                cursor: pointer;
                user-select: none;
                transition: background 0.2s;
            }

            .tool-header:hover {
                background: rgba(255, 255, 255, 0.05);
            }

            .tool-name {
                font-size: 13px;
                font-weight: 500;
                font-family: "SF Mono", Monaco, "Courier New", monospace;
                color: #4caf50;
            }

            .tool-status {
                font-size: 11px;
                color: #888;
            }

            .tool-expand {
                font-size: 11px;
                color: #888;
            }

            .tool-body {
                padding: 8px 12px;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                display: none;
            }

            .tool-body.expanded {
                display: block;
            }

            .tool-section {
                margin-bottom: 8px;
            }

            .tool-section-title {
                font-size: 11px;
                font-weight: 500;
                color: #888;
                margin-bottom: 4px;
                text-transform: uppercase;
            }

            .tool-section-content {
                font-size: 12px;
                font-family: "SF Mono", Monaco, "Courier New", monospace;
                background: rgba(0, 0, 0, 0.3);
                padding: 8px;
                border-radius: 4px;
                overflow-x: auto;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .message-timestamp {
                font-size: 11px;
                color: #888;
                margin-top: 4px;
                padding: 0 4px;
            }

            .typing-indicator {
                display: flex;
                gap: 4px;
                padding: 12px 14px;
                background: #2d2d2d;
                border-radius: 16px;
                border-bottom-left-radius: 4px;
                width: fit-content;
            }

            .typing-indicator span {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #666;
                animation: typing 1.4s ease-in-out infinite;
            }

            .typing-indicator span:nth-child(2) {
                animation-delay: 0.2s;
            }

            .typing-indicator span:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes typing {
                0%,
                60%,
                100% {
                    transform: translateY(0);
                    opacity: 0.7;
                }
                30% {
                    transform: translateY(-10px);
                    opacity: 1;
                }
            }

            /* Input area */
            .input-area {
                background: #2d2d2d;
                border-top: 1px solid #3d3d3d;
                padding: 12px 16px;
                display: flex;
                gap: 8px;
                align-items: flex-end;
                flex-shrink: 0;
            }

            .input-wrapper {
                flex: 1;
                position: relative;
            }

            #messageInput {
                width: 100%;
                min-height: 40px;
                max-height: 120px;
                padding: 10px 12px;
                background: #1e1e1e;
                border: 1px solid #444;
                border-radius: 20px;
                color: #e0e0e0;
                font-size: 15px;
                font-family: inherit;
                resize: none;
                outline: none;
                overflow-y: auto;
            }

            #messageInput:focus {
                border-color: #0084ff;
            }

            #messageInput::placeholder {
                color: #666;
            }

            #sendButton {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: none;
                background: #0084ff;
                color: #fff;
                font-size: 20px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition: background 0.2s;
            }

            #sendButton:hover {
                background: #0073e6;
            }

            #sendButton:active {
                transform: scale(0.95);
            }

            #sendButton:disabled {
                background: #444;
                cursor: not-allowed;
            }

            /* Connection error */
            .connection-error {
                background: #d32f2f;
                color: #fff;
                padding: 12px 16px;
                text-align: center;
                font-size: 14px;
                flex-shrink: 0;
            }

            .connection-error button {
                margin-left: 8px;
                padding: 4px 12px;
                background: rgba(255, 255, 255, 0.2);
                border: 1px solid rgba(255, 255, 255, 0.3);
                color: #fff;
                border-radius: 4px;
                cursor: pointer;
                font-size: 13px;
            }

            /* Welcome screen */
            .welcome {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 32px;
                text-align: center;
                color: #888;
            }

            .welcome h2 {
                font-size: 24px;
                color: #e0e0e0;
                margin-bottom: 12px;
            }

            .welcome p {
                font-size: 14px;
                line-height: 1.6;
                max-width: 400px;
            }

            /* Loading screen */
            .loading {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                gap: 16px;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid #444;
                border-top-color: #0084ff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* Responsive adjustments */
            @media (max-width: 600px) {
                .message {
                    max-width: 90%;
                }
                .header {
                    flex-wrap: wrap;
                }
                .model-info {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p style="color: #888">Connecting to Zed Agent...</p>
            </div>
        </div>

        <script>
            // Configure marked.js
            if (typeof marked !== "undefined") {
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    headerIds: false,
                    mangle: false,
                });
            }

            // Extract token from URL query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");

            // State
            let ws = null;
            let isConnected = false;
            let reconnectAttempts = 0;
            const maxReconnectAttempts = 5;
            let reconnectTimeout = null;
            const messages = [];
            const entries = {}; // Track entries by entry_index for proper ordering
            let currentModel = { id: "", name: "Loading..." };
            let tokenUsage = { used: 0, max: 0 };

            // Initialize the app
            function init() {
                if (!token) {
                    showError("No authentication token provided. Please use the pairing URL from Zed.");
                    return;
                }
                connectWebSocket();
            }

            // Connect to WebSocket
            function connectWebSocket() {
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const wsUrl = `${protocol}//${window.location.host}/ws?token=${token}`;

                try {
                    ws = new WebSocket(wsUrl);

                    ws.onopen = () => {
                        console.log("WebSocket connected");
                        isConnected = true;
                        reconnectAttempts = 0;
                        renderApp();
                    };

                    ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            handleMessage(data);
                        } catch (e) {
                            console.error("Failed to parse message:", e);
                        }
                    };

                    ws.onerror = (error) => {
                        console.error("WebSocket error:", error);
                    };

                    ws.onclose = () => {
                        console.log("WebSocket closed");
                        isConnected = false;
                        renderApp();
                        attemptReconnect();
                    };
                } catch (e) {
                    console.error("Failed to create WebSocket:", e);
                    showError("Failed to connect to Zed Agent.");
                }
            }

            // Handle incoming messages
            function handleMessage(data) {
                if (data.type === "textChunk") {
                    const entryIndex = data.entry_index;

                    // Ensure entry exists
                    if (!entries[entryIndex]) {
                        entries[entryIndex] = {
                            type: "assistant",
                            content: "",
                            timestamp: new Date(),
                            complete: false,
                        };
                    }

                    // Append text content
                    entries[entryIndex].content += data.content;

                    // Rebuild messages from entries
                    rebuildMessages();
                    updateMessagesView();
                    scrollToBottom();
                } else if (data.type === "toolStart") {
                    const entryIndex = data.entry_index;

                    // Create tool entry
                    if (!entries[entryIndex]) {
                        entries[entryIndex] = {
                            type: "tool",
                            tool_call_id: data.tool_call_id,
                            name: data.tool_name,
                            input: data.tool_input,
                            result: null,
                            error: null,
                            expanded: false,
                            timestamp: new Date(),
                        };
                    }

                    rebuildMessages();
                    updateMessagesView();
                } else if (data.type === "toolResult") {
                    const entryIndex = data.entry_index;

                    // Update existing tool entry
                    if (entries[entryIndex] && entries[entryIndex].type === "tool") {
                        entries[entryIndex].result = data.result;
                        entries[entryIndex].error = data.error;
                    }

                    rebuildMessages();
                    updateMessagesView();
                } else if (data.type === "responseComplete") {
                    const entryIndex = data.entry_index;

                    // Mark entry as complete
                    if (entries[entryIndex]) {
                        entries[entryIndex].complete = true;
                    }

                    rebuildMessages();
                    updateMessagesView();
                } else if (data.type === "error") {
                    addMessage("assistant", `Error: ${data.message}`);
                } else if (data.type === "connected") {
                    console.log("Connected with session ID:", data.session_id);
                } else if (data.type === "tokenUsageUpdate") {
                    // Update token usage display
                    tokenUsage.used = data.used_tokens;
                    tokenUsage.max = data.max_tokens;
                    renderApp();
                } else if (data.type === "modelInfoUpdate") {
                    // Update model info display
                    console.log("Model info update received:", data);
                    currentModel.id = data.model_id;
                    currentModel.name = data.model_name;
                    renderApp();
                }
            }

            // Rebuild messages array from entries in order
            function rebuildMessages() {
                messages.length = 0;

                // Get sorted entry indices
                const sortedIndices = Object.keys(entries)
                    .map((k) => parseInt(k))
                    .sort((a, b) => a - b);

                let currentMessage = null;

                for (const idx of sortedIndices) {
                    const entry = entries[idx];

                    if (entry.type === "assistant") {
                        // Start a new assistant message or continue existing one
                        if (!currentMessage || currentMessage.role !== "assistant") {
                            currentMessage = {
                                role: "assistant",
                                content: entry.content,
                                timestamp: entry.timestamp,
                                complete: entry.complete || false,
                                tools: [],
                            };
                            messages.push(currentMessage);
                        } else {
                            // Continue existing assistant message
                            currentMessage.content += entry.content;
                            if (entry.complete) {
                                currentMessage.complete = true;
                            }
                        }
                    } else if (entry.type === "tool") {
                        // Ensure we have an assistant message to attach to
                        if (!currentMessage || currentMessage.role !== "assistant") {
                            currentMessage = {
                                role: "assistant",
                                content: "",
                                timestamp: entry.timestamp,
                                complete: false,
                                tools: [],
                            };
                            messages.push(currentMessage);
                        }

                        // Add tool to current message
                        currentMessage.tools.push({
                            id: entry.tool_call_id,
                            name: entry.name,
                            input: entry.input,
                            result: entry.result,
                            error: entry.error,
                            expanded: entry.expanded,
                        });
                    }
                }
            }

            // Attempt to reconnect
            function attemptReconnect() {
                if (reconnectAttempts >= maxReconnectAttempts) {
                    showError("Connection lost. Maximum reconnection attempts reached.");
                    return;
                }

                reconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 10000);

                reconnectTimeout = setTimeout(() => {
                    console.log(`Reconnecting... (attempt ${reconnectAttempts})`);
                    connectWebSocket();
                }, delay);
            }

            // Send a message
            function sendMessage(content) {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    addMessage("assistant", "Cannot send message: Not connected to Zed Agent.");
                    return;
                }

                addMessage("user", content);

                const message = {
                    type: "chat",
                    content: content,
                };

                ws.send(JSON.stringify(message));
            }

            // Add a message to the UI
            function addMessage(role, content) {
                messages.push({
                    role,
                    content,
                    timestamp: new Date(),
                    complete: true,
                    tools: [],
                    toolIndexById: {},
                });
                updateMessagesView();
                scrollToBottom();
            }

            // Scroll to bottom of messages
            function scrollToBottom() {
                setTimeout(() => {
                    const container = document.querySelector(".messages-container");
                    if (container) {
                        container.scrollTop = container.scrollHeight;
                    }
                }, 100);
            }

            // Render the app
            function renderApp() {
                const app = document.getElementById("app");

                if (!isConnected && messages.length === 0) {
                    app.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p style="color: #888;">Connecting to Zed Agent...</p>
                    </div>
                `;
                    return;
                }

                const statusText = isConnected ? "Connected" : "Disconnected";
                const statusClass = isConnected ? "connected" : "error";

                // Calculate token usage ratio
                let tokenClass = "";
                let tokenPercent = 0;
                if (tokenUsage.max > 0) {
                    tokenPercent = Math.round((tokenUsage.used / tokenUsage.max) * 100);
                    if (tokenPercent >= 100) {
                        tokenClass = "exceeded";
                    } else if (tokenPercent >= 80) {
                        tokenClass = "warning";
                    }
                }

                const tokenDisplay =
                    tokenUsage.max > 0
                        ? `${tokenUsage.used.toLocaleString()} / ${tokenUsage.max.toLocaleString()} (${tokenPercent}%)`
                        : tokenUsage.used > 0
                          ? `${tokenUsage.used.toLocaleString()} tokens`
                          : "Not available";

                app.innerHTML = `
                <div class="header">
                    <div class="header-left">
                        <h1>Zed Agent</h1>
                        <div class="status">
                            <span class="status-dot ${statusClass}"></span>
                            <span>${statusText}</span>
                        </div>
                    </div>
                    <div class="header-right">
                        <div class="model-info">
                            <div class="model-name">${escapeHtml(currentModel.name)}</div>
                            <div class="token-usage ${tokenClass}">${tokenDisplay}</div>
                        </div>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    ${messages.length === 0 ? renderWelcome() : renderMessages()}
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            placeholder="Ask me anything..."
                            rows="1"
                            ${!isConnected ? "disabled" : ""}
                        ></textarea>
                    </div>
                    <button
                        id="sendButton"
                        ${!isConnected ? "disabled" : ""}
                    >➤</button>
                </div>
            `;

                attachEventListeners();
            }

            // Incrementally update only the messages view to avoid full "blink" on streaming/tool updates.
            function updateMessagesView() {
                const container = document.getElementById("messagesContainer");
                if (!container) {
                    // If the app hasn't rendered yet, fall back to full render.
                    renderApp();
                    return;
                }

                container.innerHTML = messages.length === 0 ? renderWelcome() : renderMessages();
                attachEventListeners();
            }

            // Render welcome screen
            function renderWelcome() {
                return `
                <div class="welcome">
                    <h2>👋 Welcome to Zed Agent</h2>
                    <p>You're connected to your Zed editor's AI assistant. Ask me anything about your code, request file edits, or get help with your project.</p>
                </div>
            `;
            }

            // Render messages with proper interleaving
            function renderMessages() {
                return messages
                    .map((msg) => {
                        const time = new Date(msg.timestamp).toLocaleTimeString([], {
                            hour: "2-digit",
                            minute: "2-digit",
                        });

                        let html = `<div class="message ${msg.role}">`;

                        // Render tools first (they happen before text)
                        if (msg.tools && msg.tools.length > 0) {
                            html += renderToolCalls(msg.tools);
                        }

                        // Then render text content if any
                        if (msg.content) {
                            const contentHtml = formatMessageContent(msg.content);
                            html += `<div class="message-content">${contentHtml}</div>`;
                        }

                        html += `<div class="message-timestamp">${time}</div>`;
                        html += `</div>`;

                        return html;
                    })
                    .join("");
            }

            // Render tool calls
            function renderToolCalls(tools) {
                return `
                    <div class="tool-calls">
                        ${tools
                            .map((tool) => {
                                const status = tool.error ? "❌ Error" : tool.result ? "✓ Complete" : "⏳ Running";
                                const expanded = tool.expanded ? "expanded" : "";
                                const expandIcon = tool.expanded ? "▼" : "▶";
                                const toolId = escapeHtml(tool.id);

                                return `
                                <div class="tool-call" data-tool-id="${toolId}">
                                    <div class="tool-header" onclick="toggleTool('${toolId}')">
                                        <div>
                                            <span class="tool-name">${escapeHtml(tool.name)}</span>
                                            <span class="tool-status"> • ${status}</span>
                                        </div>
                                        <span class="tool-expand">${expandIcon}</span>
                                    </div>
                                    <div class="tool-body ${expanded}">
                                        ${
                                            tool.input
                                                ? `
                                            <div class="tool-section">
                                                <div class="tool-section-title">Input</div>
                                                <div class="tool-section-content">${escapeHtml(JSON.stringify(tool.input, null, 2))}</div>
                                            </div>
                                        `
                                                : ""
                                        }
                                        ${
                                            tool.result
                                                ? `
                                            <div class="tool-section">
                                                <div class="tool-section-title">Result</div>
                                                <div class="tool-section-content">${escapeHtml(tool.result.substring(0, 500))}${tool.result.length > 500 ? "..." : ""}</div>
                                            </div>
                                        `
                                                : ""
                                        }
                                        ${
                                            tool.error
                                                ? `
                                            <div class="tool-section">
                                                <div class="tool-section-title">Error</div>
                                                <div class="tool-section-content" style="color: #f44336;">${escapeHtml(tool.error)}</div>
                                            </div>
                                        `
                                                : ""
                                        }
                                    </div>
                                </div>
                            `;
                            })
                            .join("")}
                    </div>
                `;
            }

            // Toggle tool expansion
            function toggleTool(toolId) {
                // Find the entry with this tool_call_id
                for (const entryIndex in entries) {
                    const entry = entries[entryIndex];
                    if (entry.type === "tool" && entry.tool_call_id === toolId) {
                        // Preserve scroll and avoid triggering auto-scroll-to-bottom
                        const container = document.querySelector(".messages-container");
                        const scrollTop = container ? container.scrollTop : 0;

                        entry.expanded = !entry.expanded;
                        rebuildMessages();
                        renderApp();

                        setTimeout(() => {
                            const newContainer = document.querySelector(".messages-container");
                            if (newContainer) {
                                newContainer.scrollTop = scrollTop;
                            }
                        }, 0);
                        break;
                    }
                }
            }

            // Escape HTML helper
            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            // Format message content using markdown
            function formatMessageContent(content) {
                // Use marked.js for proper markdown rendering
                if (typeof marked !== "undefined") {
                    try {
                        return marked.parse(content);
                    } catch (e) {
                        console.error("Marked.js parse error:", e);
                        return escapeHtml(content).replace(/\n/g, "<br>");
                    }
                } else {
                    // Fallback if marked.js not loaded
                    return escapeHtml(content).replace(/\n/g, "<br>");
                }
            }

            // Attach event listeners
            function attachEventListeners() {
                const input = document.getElementById("messageInput");
                const sendButton = document.getElementById("sendButton");

                if (!input || !sendButton) return;

                // Auto-resize textarea
                input.addEventListener("input", () => {
                    input.style.height = "auto";
                    input.style.height = Math.min(input.scrollHeight, 120) + "px";
                });

                // Send on Enter (but allow Shift+Enter for new line)
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && !e.shiftKey) {
                        e.preventDefault();
                        handleSend();
                    }
                });

                // Send button click
                sendButton.addEventListener("click", handleSend);
            }

            // Handle send action
            function handleSend() {
                const input = document.getElementById("messageInput");
                if (!input) return;

                const content = input.value.trim();
                if (!content) return;

                sendMessage(content);
                input.value = "";
                input.style.height = "auto";
            }

            // Show error screen
            function showError(message) {
                const app = document.getElementById("app");
                app.innerHTML = `
                <div class="header">
                    <h1>Zed Agent</h1>
                    <div class="status">
                        <span class="status-dot error"></span>
                        <span>Error</span>
                    </div>
                </div>
                <div class="messages-container">
                    <div class="welcome">
                        <h2>⚠️ Connection Error</h2>
                        <p>${message}</p>
                    </div>
                </div>
            `;
            }

            // Start the app
            init();
        </script>
    </body>
</html>
