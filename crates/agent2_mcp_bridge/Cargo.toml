[package]
name = "agent2_mcp_bridge"
version = "0.1.0"
edition = "2021"
description = "MCP bridge exposing agent2 context management tools (list_history, memory, rewrite_history) via JSON-RPC."
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
# Reserved for future metadata (e.g., build info, commit hash embedding)

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { workspace = true }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.3"

# Workspace (path) dependencies into existing Zed crates.
agent2 = { path = "../agent2" }
agent-client-protocol = { workspace = true }
gpui = { path = "../gpui" }

[dev-dependencies]
# (Optional) Add test-only crates here.

[features]
default = []
# Potential future features (e.g., streaming, message_injection) can be added here.

[profile.release]
codegen-units = 1
lto = "thin"
debug = 1
opt-level = "z"

[profile.dev]
debug = 1
incremental = true