[package]
name = "chat_history"
version = "0.2.1"
edition = "2024"
description = "Chat history core: metadata, messages, async embeddings, hybrid retrieval, similar chats, re-embedding, summarization triggers, optional persistence."
license = "Apache-2.0"
publish = false
repository = "https://github.com/zed-industries/zed"
readme = false

[lib]
# Descriptive root file (no lib.rs) per workspace guidelines.
path = "src/chat_history.rs"
crate-type = ["rlib"]

[package.metadata.docs]
categories = ["llm", "search", "assistant"]
keywords = ["chat", "history", "retrieval", "rag", "embedding", "persistence"]
spec_sections = [
  "config layering",
  "embedding backends",
  "hybrid retrieval",
  "similar chats",
  "re-embedding lifecycle",
  "summarization triggers",
  "persistence snapshot"
]

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock","serde"] }
uuid = { version = "1", features = ["v4","serde"] }
futures = "0.3"
log = "0.4"
tokio = { version = "1", optional = true, features = ["rt-multi-thread","macros","sync","time"] }

# Embedding / retrieval related (all optional, feature-gated)
fastembed = { version = "5.2.0", optional = true, features = ["hf-hub-native-tls","ort-download-binaries"] }
async-openai = { version = "0.20", optional = true }
reqwest = { version = "0.11", optional = true, default-features = false, features = ["json","rustls-tls","blocking"] }
rayon = { version = "1.8", optional = true }

# Internal DB crate for optional persistence (key-value snapshot).
db = { path = "../db", optional = true }

[features]
# Baseline default: runtime + lexical retrieval only
default = [
  "runtime-tokio",
  "retrieval-lexical",
]

# Runtime selection
runtime-tokio = ["tokio"]

# Embedding backends
embedding-fastembed = ["fastembed"]
embedding-openai = ["async-openai", "reqwest", "tokio"]
embedding-azure = ["reqwest", "tokio"]

# Retrieval modes
retrieval-lexical = []
retrieval-embedding = []
retrieval-hybrid = ["retrieval-lexical", "retrieval-embedding"]

# RAG answer synthesis (placeholder heuristic + potential model calls)
rag = ["retrieval-hybrid", "async-openai", "tokio"]

# Parallel acceleration
parallel = ["rayon"]

# Optional persistence (JSON snapshot via KeyValueStore)
chat-persistence = ["db"]

# Convenience umbrella enabling everything
full = [
  "runtime-tokio",
  "embedding-fastembed",
  "embedding-openai",
  "embedding-azure",
  "retrieval-hybrid",
  "rag",
  "parallel",
  "chat-persistence",
]

[package.metadata.feature-status]
runtime-tokio = "stable"
embedding-fastembed = "experimental"
embedding-openai = "experimental"
embedding-azure = "experimental"
retrieval-lexical = "baseline"
retrieval-embedding = "experimental"
retrieval-hybrid = "experimental"
rag = "prototype"
parallel = "experimental"
chat-persistence = "prototype"
full = "meta"

[badges]
maintenance = { status = "experimental" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread","macros","sync","time"] }

[package.metadata.lints]
# Placeholder for future workspace lint policy.